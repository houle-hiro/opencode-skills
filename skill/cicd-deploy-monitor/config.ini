; cicd-deploy-monitor skill 配置文件
; =====================================
; 标准 INI 格式，由 Python 内置 configparser 解析，零三方依赖。
; 优先级（高 → 低）：CLI 参数 > 环境变量 > 本文件 > 脚本内置默认。

[log_service]
; 后台日志服务基础 URL
url = http://81.70.210.89:8080
; 轮询间隔（秒）
poll_interval_sec = 10
; 总超时（秒），超过后退出码 = 2
timeout_sec = 1800

[paths]
; 产物输出根目录（脚本会再下分 raw/<name>/ 与 extracted/<name>/<commit>/）
out_dir = ./_cicd_logs
; 默认 watches 列表，逗号分隔；留空则必须用 --watch / LOG_WATCHES 显式指定
watches =
; 示例：watches = bgw=a586ff5e, mc=ad6caad8, gids=0123abcd

[repos]
; 几个仓库的共同父目录（仅作文档锚点；不参与脚本行为）
work_dir = /home/lele/project/work/csp-ysj/sbg
bgw_path = /home/lele/project/work/csp-ysj/sbg/BrowserGateway
gids_path = /home/lele/project/work/csp-ysj/sbg/GlobalInstanceDeliverService
mc_path = /home/lele/project/work/csp-ysj/sbg/MediaCacheService
